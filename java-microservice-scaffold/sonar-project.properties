# SonarQube — java-microservice-scaffold（在 java-microservice-scaffold/ 目录执行 mvn sonar:sonar）
sonar.projectKey=java-microservice-scaffold
sonar.projectName=java-microservice-scaffold
sonar.projectVersion=1.0.0-SNAPSHOT

sonar.host.url=http://localhost:9000
# sonar.token=<在 SonarQube 控制台 User > My Account > Generate Token 后填入，或 -Dsonar.token= 传入>

sonar.sourceEncoding=UTF-8
sonar.java.source=17
sonar.modules=skeleton-service
skeleton-service.sonar.projectName=skeleton-service

# JaCoCo 覆盖率（先 mvn test）
sonar.coverage.jacoco.xmlReportPaths=skeleton-service/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=skeleton-service/target/surefire-reports

sonar.exclusions=**/target/**,**/dto/**,**/entity/**,**/config/**,**/*Application.java
