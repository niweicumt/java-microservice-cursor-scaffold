openapi: 3.0.3
info:
  title: 用户管理 API
  description: 用户 CRUD、分页与条件查询；统一返回 Result(code, msg, data)
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: 本地开发 (dev)

tags:
  - name: users
    description: 用户管理

paths:
  /api/v1/users:
    post:
      tags: [users]
      summary: 创建用户
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [users]
      summary: 分页条件查询用户
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: username
          in: query
          description: 用户名模糊匹配
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
        - name: email
          in: query
          schema:
            type: string
        - name: phone
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserPage'

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [users]
      summary: 按 ID 查询用户
      operationId: getUserById
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserVO'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [users]
      summary: 更新用户
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [users]
      summary: 逻辑删除用户
      operationId: deleteUser
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Result:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          example: 200
        msg:
          type: string
          example: success
        data:
          nullable: true

    UserVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: integer
          description: 1=启用 0=停用
        createTime:
          type: string
          format: date-time
        updateTime:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 32
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          type: integer
          enum: [0, 1]
          default: 1

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          type: integer
          enum: [0, 1]

    UserPage:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/UserVO'
        total:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer

    ResultUserVO:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserVO'

    ResultUserPage:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserPage'

    ResultVoid:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              nullable: true

    ErrorResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              nullable: true

  responses:
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 400
            msg: 参数校验失败
            data: null
    NotFound:
      description: 用户不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 404
            msg: 用户不存在
            data: null
    Conflict:
      description: 用户名或邮箱冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
          example:
            code: 409
            msg: 用户名或邮箱已存在
            data: null
