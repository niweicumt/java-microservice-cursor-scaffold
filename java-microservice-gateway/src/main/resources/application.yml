server:
  port: 8080

spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  config:
    import: optional:nacos:gateway-service.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml
        group: DEFAULT_GROUP
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: skeleton-service-api
          uri: lb://skeleton-service
          predicates:
            - Path=/api/v1/**
        - id: skeleton-service-doc
          uri: lb://skeleton-service
          predicates:
            - Path=/v3/api-docs/**,/doc.html/**,/swagger-ui/**,/webjars/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
  main:
    web-application-type: reactive

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

knife4j:
  gateway:
    enabled: true
    strategy: discover
    discover:
      enabled: true
      version: openapi3

logging:
  level:
    org.springframework.cloud.gateway: INFO
